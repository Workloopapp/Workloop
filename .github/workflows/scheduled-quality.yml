name: Scheduled quality

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: scheduled-quality
  cancel-in-progress: false

jobs:
  backup-health:
    name: Production backup freshness
    if: ${{ vars.ENABLE_BACKUP_HEALTH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_BACKUP_READ_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_MAX_AGE_HOURS: "36"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify latest completed backup
        run: bash scripts/verify_supabase_backup.sh

  broad-regression:
    name: Broad regression and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_SUPABASE_URL: https://example.supabase.co
      CI_SUPABASE_ANON_KEY: ci-public-anon-key

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run all unit, widget, and golden tests
        run: >-
          flutter test --coverage
          --dart-define=SUPABASE_URL="$CI_SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$CI_SUPABASE_ANON_KEY"

      - name: Report resolvable dependency updates
        run: flutter pub outdated --no-transitive

      - name: Scan supported lockfiles for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --lockfile=ios/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            --lockfile=ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved

  staging-load:
    name: Moderate read load against isolated staging
    if: ${{ vars.ENABLE_STAGING_LOAD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOAD_TEST_ENV: staging
      ALLOW_STAGING_LOAD: "true"
      CONFIRM_STAGING_COST: "true"
      LOAD_PROFILE: moderate
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      TEST_ACCESS_TOKEN: ${{ secrets.STAGING_TEST_ACCESS_TOKEN }}
      WORKSPACE_ID: ${{ secrets.STAGING_WORKSPACE_ID }}
      PUBLIC_HANDLE: ${{ vars.STAGING_PUBLIC_HANDLE }}
      BOOKING_WRITE_ENABLED: "false"
      FINANCE_WRITE_ENABLED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: "1.3.0"

      - name: Run staging-only load profile
        run: k6 run quality/load/workloop_staging.js
